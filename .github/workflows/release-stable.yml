name: Release Stable

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'setup.iss'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: true

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows installer
    needs: read-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # build.rs embeds the icon only when assets/logo.ico exists.
      # ImageMagick is pre-installed on windows-latest runners.
      # ICO format supports a maximum size of 256x256.
      - name: Generate logo.ico from logo.png
        run: magick assets/logo.png -resize 256x256 assets/logo.ico

      - name: Build release binary
        run: cargo build --release

      # Inno Setup is pre-installed on windows-latest runners.
      - name: Build Windows installer with Inno Setup
        run: iscc setup.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/lekhani-latexSetup.exe

  build-macos:
    name: Build macOS app
    needs: read-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build release binary (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build release binary (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/lekhani-latex \
            target/x86_64-apple-darwin/release/lekhani-latex \
            -output target/release/lekhani-latex-universal

      - name: Create macOS .app bundle
        run: |
          APP_NAME="Lekhani LaTeX"
          APP_DIR="${APP_NAME}.app"
          VERSION="${{ needs.read-version.outputs.version }}"

          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp target/release/lekhani-latex-universal "${APP_DIR}/Contents/MacOS/lekhani-latex"
          chmod +x "${APP_DIR}/Contents/MacOS/lekhani-latex"

          # Convert logo.png to .icns for macOS app icon
          mkdir -p icon.iconset
          sips -z 16 16     assets/logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/logo.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/logo.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/logo.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/logo.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/logo.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "${APP_DIR}/Contents/Resources/AppIcon.icns"
          rm -rf icon.iconset

          # Create Info.plist
          cat > "${APP_DIR}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>com.borneelphukan.lekhani-latex</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>lekhani-latex</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          hdiutil create -volname "Lekhani LaTeX" \
            -srcfolder "Lekhani LaTeX.app" \
            -ov -format UDZO \
            "Lekhani-LaTeX.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Lekhani-LaTeX.dmg

  publish:
    name: Publish stable release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: "Stable Release"
          body: |
            **Stable build** from the `main` branch.

            This release is automatically updated on every push to `main`.
            It is the recommended download for most users.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}
          prerelease: false
          make_latest: true
          files: |
            windows-installer/lekhani-latexSetup.exe
            macos-dmg/Lekhani-LaTeX.dmg
