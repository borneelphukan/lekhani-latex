name: Build Nightly Release (dev branch)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run sccache-action
        uses: Mozilla-Actions/sccache-action@v0.0.7

      - name: Install cargo-chef
        run: cargo install cargo-chef

      - name: Prepare recipe
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cook dependencies
        run: cargo chef cook --release --target x86_64-pc-windows-msvc --recipe-path recipe.json

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create Nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lekhani LaTeX Nightly
          tag_name: windows-nightly-${{ github.sha }}
          draft: true
          prerelease: true
          files: |
            target/x86_64-pc-windows-msvc/release/lekhani-latex.exe
