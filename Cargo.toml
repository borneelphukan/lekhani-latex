[workspace]
resolver = "2"
members = [
    "core",
    "compiler",
    "gui"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A modern, easy-to-use LaTeX editor with live preview"
license = "MIT"

[workspace.dependencies]
egui = "0.34"
eframe = { version = "0.34", features = ["default"] }
regex = "1"
image = "0.25"
thiserror = "2"
rfd = "0.17"
ureq = "3"
dirs = "6"
arboard = "3.6.1"
serde_json = "1.0.150"
winres = "0.1.12"

[profile.release]
opt-level = 2
strip = true
