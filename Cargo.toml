[workspace]
resolver = "2"
members = [
    "core",
    "compiler",
    "gui"
]

[workspace.package]
version = "0.0.6"
edition = "2021"
description = "A modern, easy-to-use LaTeX editor with live preview"
license = "MIT"

[workspace.dependencies]
egui = "0.34"
# `accesskit` is off: on Linux it pulls the zbus/atspi stack and quick-xml
# 0.39, which has open security advisories. Re-enable it after upgrading to an
# egui release that uses quick-xml >= 0.41. The explicit winit dependency
# restores `winit/default` (Wayland dynamic loading and client-side
# decorations), which disabling eframe's defaults also drops.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = "0.30"
regex = "1"
image = "0.25"
thiserror = "2"
rfd = "0.17"
ureq = "3"
dirs = "6"
arboard = "3.6.1"
serde_json = "1.0.150"
winres = "0.1.12"

[profile.release]
opt-level = 2
strip = true
